<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Market Dashboard · 7 Stocks</title>
    <style>
        /* ─── reset & base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f4f7fc;
            padding: 20px 32px 32px;
            color: #1a2639;
        }
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .top-bar h1 {
            font-size: 26px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #4a5b74;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .controls label {
            font-size: 13px;
            font-weight: 500;
            color: #3a4f68;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .controls input[type="number"] {
            width: 60px;
            padding: 4px 6px;
            border: 1.5px solid #d7e0e9;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            background: #f8faff;
            outline: none;
        }
        .controls input:focus {
            border-color: #4a8ed9;
        }
        .btn {
            background: #1d2b3f;
            color: #fff;
            border: none;
            padding: 6px 18px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn:hover { background: #2a3d56; }
        .btn.primary { background: #2b6bb0; }
        .btn.primary:hover { background: #1f5a9a; }
        .btn.danger { background: #b64a4a; }
        .btn.danger:hover { background: #9e3d3d; }
        .btn.success { background: #2d8f5c; }
        .btn.success:hover { background: #237a4c; }

        .big-chart-wrap {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            padding: 16px 18px 12px;
            margin-bottom: 24px;
        }
        .big-chart-wrap canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 340;
            display: block;
            border-radius: 8px;
            background: #fafcff;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 24px;
            margin-top: 8px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .stock-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            padding: 14px 16px 12px;
            transition: box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .stock-card:hover { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07); }
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .stock-name {
            font-weight: 600;
            font-size: 16px;
        }
        .stock-price {
            font-weight: 600;
            font-size: 18px;
        }
        .stock-change {
            font-size: 14px;
            font-weight: 500;
            margin-left: 8px;
        }
        .stock-change.up { color: #00a859; }
        .stock-change.down { color: #e84141; }
        .sparkline {
            width: 100%;
            height: 70px;
            margin: 4px 0 6px;
            border-radius: 6px;
            background: #fafcff;
        }
        .stock-stats {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #4a5b74;
            border-top: 1px solid #edf2f7;
            padding-top: 8px;
            margin-top: 2px;
        }
        .stock-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stock-stats .value {
            font-weight: 600;
            color: #1a2639;
        }
        .decision-badge {
            display: inline-block;
            padding: 1px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .decision-badge.buy { background: #d4edda; color: #1d6e46; }
        .decision-badge.sell { background: #f8d7da; color: #9e3d3d; }
        .decision-badge.hold { background: #e8edf4; color: #4a5b74; }
        .prob-bar {
            width: 100%;
            height: 5px;
            background: #edf2f7;
            border-radius: 3px;
            margin: 4px 0 2px;
            overflow: hidden;
        }
        .prob-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .summary {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .summary h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
        }
        .summary-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
        }
        .summary-item .label {
            font-size: 13px;
            color: #4a5b74;
        }
        .summary-item .number {
            font-size: 20px;
            font-weight: 600;
            margin-top: 2px;
        }
        .summary-item .number.up { color: #00a859; }
        .summary-item .number.down { color: #e84141; }

        @media (max-width: 700px) {
            body { padding: 12px; }
            .grid { grid-template-columns: 1fr; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .controls { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="top-bar">
            <h1>
                📈 Market Dashboard
                <small>7 stocks · live</small>
            </h1>
            <div class="controls">
                <label>delay (ms)
                    <input type="number" id="intervalInput" value="1000" min="200" max="5000" step="100" />
                </label>
                <button class="btn success" id="playBtn">▶ Play</button>
                <button class="btn" id="resetBtn">⟳ Reset</button>
            </div>
        </div>

        <!-- BIG CHART -->
        <div class="big-chart-wrap">
            <canvas id="mainChart" width="800" height="340"></canvas>
            <div class="legend" id="legendContainer"></div>
        </div>

        <!-- STOCK CARDS -->
        <div class="grid" id="stockGrid"></div>

        <!-- SUMMARY -->
        <div class="summary" id="summarySection">
            <h2>📊 Market Summary</h2>
            <div class="summary-grid" id="summaryGrid"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────────────────
            const mainCanvas = document.getElementById('mainChart');
            const mainCtx = mainCanvas.getContext('2d');
            const grid = document.getElementById('stockGrid');
            const summaryGrid = document.getElementById('summaryGrid');
            const legendContainer = document.getElementById('legendContainer');
            const playBtn = document.getElementById('playBtn');
            const resetBtn = document.getElementById('resetBtn');
            const intervalInput = document.getElementById('intervalInput');

            // ─── constants ────────────────────────────────────────────
            const W = 800,
                H = 340;
            const PAD = { top: 20, right: 30, bottom: 28, left: 50 };
            const PLOT_W = W - PAD.left - PAD.right;
            const PLOT_H = H - PAD.top - PAD.bottom;

            const STOCK_COLORS = [
                '#2b6bb0', '#e84141', '#00a859', '#f39c12', '#8e44ad', '#1abc9c', '#e67e22'
            ];
            const STOCK_NAMES = ['AAPL', 'GOOGL', 'MSFT', 'AMZN', 'TSLA', 'META', 'NVDA'];

            // ─── state ────────────────────────────────────────────────
            const NUM_STOCKS = 7;
            const MAX_POINTS = 120;

            let stocks = [];
            let isPlaying = false;
            let intervalId = null;
            let updateCounter = 0;

            // ─── helpers ──────────────────────────────────────────────
            function rand(min, max) { return Math.random() * (max - min) + min; }

            function randNormal() {
                let u = 0,
                    v = 0;
                while (u === 0) u = Math.random();
                while (v === 0) v = Math.random();
                return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
            }

            function clamp(val, lo, hi) { return Math.min(Math.max(val, lo), hi); }

            // ─── stock initialization ─────────────────────────────────
            function initStocks() {
                const newStocks = [];
                for (let i = 0; i < NUM_STOCKS; i++) {
                    const startPrice = rand(80, 150);
                    const drift = rand(-0.0003, 0.0008);
                    const vol = rand(0.008, 0.025);
                    const prices = [startPrice];
                    // generate some initial history
                    for (let j = 1; j < 60; j++) {
                        const prev = prices[prices.length - 1];
                        const ret = drift + vol * randNormal();
                        prices.push(Math.max(prev * (1 + ret), 0.5));
                    }
                    newStocks.push({
                        name: STOCK_NAMES[i % STOCK_NAMES.length] + (i + 1),
                        color: STOCK_COLORS[i % STOCK_COLORS.length],
                        prices: prices,
                        drift: drift,
                        volatility: vol,
                    });
                }
                return newStocks;
            }

            // ─── compute probability and decision ─────────────────────
            function computeStats(prices) {
                const n = Math.min(10, prices.length - 1);
                if (n < 2) return { prob: 0.5, decision: 'hold' };
                let ups = 0;
                for (let i = prices.length - n; i < prices.length; i++) {
                    if (prices[i] > prices[i - 1]) ups++;
                }
                const prob = clamp(ups / n, 0.05, 0.95);
                let decision = 'hold';
                if (prob > 0.6) decision = 'buy';
                else if (prob < 0.4) decision = 'sell';
                return { prob, decision };
            }

            // ─── add new price for each stock ─────────────────────────
            function stepStocks() {
                for (const stock of stocks) {
                    const prev = stock.prices[stock.prices.length - 1];
                    const ret = stock.drift + stock.volatility * randNormal();
                    const newPrice = Math.max(prev * (1 + ret), 0.5);
                    stock.prices.push(newPrice);
                    if (stock.prices.length > MAX_POINTS) {
                        stock.prices.shift();
                    }
                }
                updateCounter++;
            }

            // ─── drawing: big chart ───────────────────────────────────
            function drawMainChart() {
                mainCtx.clearRect(0, 0, W, H);
                mainCtx.fillStyle = '#fafcff';
                mainCtx.fillRect(0, 0, W, H);

                if (stocks.length === 0 || stocks[0].prices.length < 2) return;

                // find global min/max across all stocks
                let globalMin = Infinity,
                    globalMax = -Infinity;
                for (const s of stocks) {
                    for (const p of s.prices) {
                        if (p < globalMin) globalMin = p;
                        if (p > globalMax) globalMax = p;
                    }
                }
                const padding = (globalMax - globalMin) * 0.08 || 1;
                const yMin = Math.max(globalMin - padding, 0);
                const yMax = globalMax + padding;

                // x mapping: time steps from 0..MAX_POINTS-1
                const xMin = 0;
                const xMax = MAX_POINTS - 1;

                // draw grid
                mainCtx.save();
                mainCtx.strokeStyle = '#e8eef5';
                mainCtx.lineWidth = 0.8;
                for (let i = 0; i <= 6; i++) {
                    const y = yMin + (yMax - yMin) * (i / 6);
                    const cy = PAD.top + PLOT_H - ((y - yMin) / (yMax - yMin)) * PLOT_H;
                    mainCtx.beginPath();
                    mainCtx.moveTo(PAD.left, cy);
                    mainCtx.lineTo(W - PAD.right, cy);
                    mainCtx.stroke();
                    // label
                    mainCtx.fillStyle = '#4d657f';
                    mainCtx.font = '10px Inter, sans-serif';
                    mainCtx.textAlign = 'right';
                    mainCtx.textBaseline = 'middle';
                    mainCtx.fillText(y.toFixed(1), PAD.left - 6, cy);
                }
                mainCtx.restore();

                // draw each stock line
                for (const stock of stocks) {
                    const pts = stock.prices;
                    const color = stock.color;

                    mainCtx.save();
                    mainCtx.strokeStyle = color;
                    mainCtx.lineWidth = 2.0;
                    mainCtx.lineJoin = 'round';
                    mainCtx.lineCap = 'round';
                    mainCtx.shadowColor = color + '40';
                    mainCtx.shadowBlur = 6;
                    mainCtx.beginPath();
                    for (let i = 0; i < pts.length; i++) {
                        const x = PAD.left + (i / (MAX_POINTS - 1)) * PLOT_W;
                        const y = PAD.top + PLOT_H - ((pts[i] - yMin) / (yMax - yMin)) * PLOT_H;
                        if (i === 0) mainCtx.moveTo(x, y);
                        else mainCtx.lineTo(x, y);
                    }
                    mainCtx.stroke();
                    mainCtx.restore();
                }

                // axes
                mainCtx.save();
                mainCtx.strokeStyle = '#2c3f57';
                mainCtx.lineWidth = 1.2;
                mainCtx.beginPath();
                mainCtx.moveTo(PAD.left, PAD.top);
                mainCtx.lineTo(PAD.left, PAD.top + PLOT_H);
                mainCtx.lineTo(W - PAD.right, PAD.top + PLOT_H);
                mainCtx.stroke();
                mainCtx.restore();

                // x labels
                mainCtx.fillStyle = '#4d657f';
                mainCtx.font = '10px Inter, sans-serif';
                mainCtx.textAlign = 'center';
                mainCtx.textBaseline = 'top';
                const step = Math.max(1, Math.floor(MAX_POINTS / 10));
                for (let i = 0; i < MAX_POINTS; i += step) {
                    const x = PAD.left + (i / (MAX_POINTS - 1)) * PLOT_W;
                    mainCtx.fillText(i, x, PAD.top + PLOT_H + 4);
                }

                // Legend is built outside
            }

            // ─── draw sparkline ──────────────────────────────────────
            function drawSparkline(canvas, prices, prob) {
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                if (!prices || prices.length < 2) return;

                const min = Math.min(...prices);
                const max = Math.max(...prices);
                const range = max - min || 1;

                // area fill with gradient
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                const color = prob > 0.5 ? '#00a859' : '#e84141';
                grad.addColorStop(0, color + '40');
                grad.addColorStop(1, color + '08');
                ctx.fillStyle = grad;
                ctx.beginPath();
                for (let i = 0; i < prices.length; i++) {
                    const x = (i / (prices.length - 1)) * w;
                    const y = h - ((prices[i] - min) / range) * (h - 4) - 2;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.lineTo(w, h);
                ctx.lineTo(0, h);
                ctx.closePath();
                ctx.fill();

                // line
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.8;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                for (let i = 0; i < prices.length; i++) {
                    const x = (i / (prices.length - 1)) * w;
                    const y = h - ((prices[i] - min) / range) * (h - 4) - 2;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // last point
                const lastX = w;
                const lastY = h - ((prices[prices.length - 1] - min) / range) * (h - 4) - 2;
                ctx.beginPath();
                ctx.arc(lastX, lastY, 3.5, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // ─── render all cards ─────────────────────────────────────
            function renderCards() {
                grid.innerHTML = '';
                for (let i = 0; i < stocks.length; i++) {
                    const s = stocks[i];
                    const stats = computeStats(s.prices);
                    const price = s.prices[s.prices.length - 1];
                    const prev = s.prices[s.prices.length - 2] || price;
                    const change = (price - prev) / prev;
                    const changePct = (change * 100).toFixed(2);
                    const changeClass = change >= 0 ? 'up' : 'down';
                    const sign = change >= 0 ? '+' : '';
                    const probPct = (stats.prob * 100).toFixed(0);
                    const decisionLabel = stats.decision.toUpperCase();

                    const card = document.createElement('div');
                    card.className = 'stock-card';
                    card.innerHTML = `
                        <div class="stock-header">
                            <span class="stock-name" style="color:${s.color}">${s.name}</span>
                            <span>
                                <span class="stock-price">$${price.toFixed(2)}</span>
                                <span class="stock-change ${changeClass}">${sign}${changePct}%</span>
                            </span>
                        </div>
                        <canvas class="sparkline" width="300" height="70"></canvas>
                        <div class="stock-stats">
                            <span>Prob: <span class="value">${probPct}%</span></span>
                            <span>Vol: <span class="value">${(s.volatility * 100).toFixed(1)}%</span></span>
                            <span>Decision: <span class="decision-badge ${stats.decision}">${decisionLabel}</span></span>
                        </div>
                        <div class="prob-bar">
                            <div class="prob-fill" style="width:${probPct}%; background: ${stats.prob > 0.5 ? '#00a859' : '#e84141'};"></div>
                        </div>
                    `;
                    grid.appendChild(card);

                    const canvas = card.querySelector('canvas');
                    drawSparkline(canvas, s.prices, stats.prob);
                }
            }

            // ─── update summary ──────────────────────────────────────
            function updateSummary() {
                const allStats = stocks.map(s => computeStats(s.prices));
                const upCount = allStats.filter(st => st.prob > 0.6).length;
                const downCount = allStats.filter(st => st.prob < 0.4).length;
                const holdCount = NUM_STOCKS - upCount - downCount;
                const avgProb = allStats.reduce((acc, st) => acc + st.prob, 0) / NUM_STOCKS;
                // compute average change over last step
                let avgChange = 0;
                for (const s of stocks) {
                    const len = s.prices.length;
                    if (len >= 2) {
                        const ch = (s.prices[len-1] - s.prices[len-2]) / s.prices[len-2];
                        avgChange += ch;
                    }
                }
                avgChange /= NUM_STOCKS;
                const avgChangePct = (avgChange * 100).toFixed(2);
                const avgSign = avgChange >= 0 ? '+' : '';

                summaryGrid.innerHTML = `
                    <div class="summary-item">
                        <div class="label">📈 Buy Signals</div>
                        <div class="number up">${upCount}</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">📉 Sell Signals</div>
                        <div class="number down">${downCount}</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">⏸ Hold</div>
                        <div class="number">${holdCount}</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">📊 Avg Probability</div>
                        <div class="number">${(avgProb * 100).toFixed(1)}%</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">📊 Avg Change</div>
                        <div class="number ${avgChange >= 0 ? 'up' : 'down'}">${avgSign}${avgChangePct}%</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">🎯 Consensus</div>
                        <div class="number" style="font-size:18px;">
                            ${upCount > downCount ? '🟢 BULLISH' : (downCount > upCount ? '🔴 BEARISH' : '⚖️ NEUTRAL')}
                        </div>
                    </div>
                `;
            }

            // ─── update legend ────────────────────────────────────────
            function renderLegend() {
                legendContainer.innerHTML = '';
                for (const s of stocks) {
                    const item = document.createElement('span');
                    item.className = 'legend-item';
                    item.innerHTML = `
                        <span class="legend-dot" style="background:${s.color}"></span>
                        ${s.name}
                    `;
                    legendContainer.appendChild(item);
                }
            }

            // ─── full render ──────────────────────────────────────────
            function renderAll() {
                drawMainChart();
                renderCards();
                updateSummary();
                renderLegend();
            }

            // ─── step forward ─────────────────────────────────────────
            function step() {
                stepStocks();
                renderAll();
            }

            // ─── reset ─────────────────────────────────────────────────
            function resetDashboard() {
                stocks = initStocks();
                updateCounter = 0;
                renderAll();
            }

            // ─── play/pause ───────────────────────────────────────────
            function togglePlay() {
                if (isPlaying) {
                    clearInterval(intervalId);
                    intervalId = null;
                    isPlaying = false;
                    playBtn.textContent = '▶ Play';
                    playBtn.className = 'btn success';
                } else {
                    const delay = parseInt(intervalInput.value, 10);
                    if (isNaN(delay) || delay < 100) {
                        intervalInput.value = 1000;
                    }
                    const d = parseInt(intervalInput.value, 10);
                    if (isPlaying === false) {
                        intervalId = setInterval(step, d);
                        isPlaying = true;
                        playBtn.textContent = '⏸ Pause';
                        playBtn.className = 'btn danger';
                    }
                }
            }

            // ─── event listeners ──────────────────────────────────────
            playBtn.addEventListener('click', togglePlay);

            resetBtn.addEventListener('click', function() {
                if (isPlaying) {
                    clearInterval(intervalId);
                    intervalId = null;
                    isPlaying = false;
                    playBtn.textContent = '▶ Play';
                    playBtn.className = 'btn success';
                }
                resetDashboard();
            });

            intervalInput.addEventListener('change', function() {
                if (isPlaying) {
                    clearInterval(intervalId);
                    const delay = parseInt(intervalInput.value, 10);
                    if (!isNaN(delay) && delay >= 100) {
                        intervalId = setInterval(step, delay);
                    } else {
                        intervalInput.value = 1000;
                        intervalId = setInterval(step, 1000);
                    }
                }
            });

            // ─── init ──────────────────────────────────────────────────
            resetDashboard();

        })();
    </script>
</body>
</html>
