<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Remote Control Presentation</title>

    <!-- QRCode.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>

    <style>
        /* ────────────── Reset & Base ────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            font: inherit;
            color: inherit;
        }
        .hidden {
            display: none !important;
        }

        /* ────────────── Shared Container ────────────── */
        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* ────────────── MODE: LANDING ────────────── */
        #landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: radial-gradient(ellipse at 50% 30%, #1a2332, #0b0e14);
            padding: 2rem;
            text-align: center;
        }
        #landing h1 {
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
            letter-spacing: -0.02em;
        }
        #landing p.sub {
            font-size: 1.1rem;
            color: #8899bb;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }
        .mode-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            justify-content: center;
        }
        .mode-btn {
            padding: 0.9rem 2.6rem;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            min-width: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
        .mode-btn:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.12);
        }
        .mode-btn.display-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0b0e14;
            border-color: transparent;
        }
        .mode-btn.display-btn:hover {
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.35);
        }
        .mode-btn.controller-btn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #0b0e14;
            border-color: transparent;
        }
        .mode-btn.controller-btn:hover {
            box-shadow: 0 0 30px rgba(245, 87, 108, 0.35);
        }
        .mode-btn .icon {
            font-size: 1.4rem;
        }

        /* ────────────── MODE: DISPLAY (Laptop) ────────────── */
        #display-mode {
            position: fixed;
            inset: 0;
            background: #0b0e14;
            z-index: 10;
        }
        #display-mode .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 4rem;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: scale(0.96);
            pointer-events: none;
            text-align: center;
            background: radial-gradient(ellipse at 50% 30%, #1a2332, #0b0e14);
        }
        #display-mode .slide.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        #display-mode .slide .emoji {
            font-size: clamp(4rem, 12vw, 8rem);
            margin-bottom: 0.5rem;
            display: block;
        }
        #display-mode .slide h2 {
            font-size: clamp(2.4rem, 6vw, 4.8rem);
            font-weight: 700;
            margin-bottom: 0.6rem;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #display-mode .slide p {
            font-size: clamp(1.1rem, 2.2vw, 2rem);
            color: #b0c4e8;
            max-width: 720px;
            line-height: 1.6;
            font-weight: 300;
        }
        #display-mode .slide ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.6rem;
            justify-content: center;
            margin-top: 0.8rem;
        }
        #display-mode .slide ul li {
            font-size: clamp(1rem, 1.8vw, 1.6rem);
            color: #b0c4e8;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.4rem 1.4rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 300;
        }
        #display-mode .slide .highlight {
            color: #4facfe;
            font-weight: 500;
        }
        #display-mode .slide-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.6rem;
            z-index: 20;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            backdrop-filter: blur(8px);
        }
        #display-mode .slide-indicator .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.3s ease, transform 0.3s ease;
        }
        #display-mode .slide-indicator .dot.active {
            background: #4facfe;
            transform: scale(1.3);
        }
        #display-mode .slide-number {
            position: absolute;
            top: 1.6rem;
            right: 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 0.04em;
            z-index: 20;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        /* ─── UPDATED: Connection status with room ID ─── */
        #display-mode .connection-status {
            position: absolute;
            top: 1.6rem;
            left: 2rem;
            right: 2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            z-index: 20;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
        }
        #display-mode .connection-status .led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4facfe;
            display: inline-block;
            animation: pulse-led 1.8s infinite;
            flex-shrink: 0;
        }
        #display-mode .connection-status .led.off {
            background: #555;
            animation: none;
        }
        @keyframes pulse-led {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        /* Permanent Room ID badge */
        #display-room-id {
            margin-left: auto;
            background: rgba(79, 172, 254, 0.15);
            padding: 2px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            color: #4facfe;
            letter-spacing: 0.08em;
            border: 1px solid rgba(79, 172, 254, 0.3);
            font-weight: 600;
            white-space: nowrap;
        }

        /* ────────────── MODE: CONTROLLER (Mobile) ────────────── */
        #controller-mode {
            position: fixed;
            inset: 0;
            background: #0b0e14;
            z-index: 20;
            display: flex;
            flex-direction: column;
            padding: 1.6rem 1.2rem;
            overflow-y: auto;
        }
        #controller-mode .ctrl-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        #controller-mode .ctrl-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }
        #controller-mode .ctrl-header .room-badge {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            color: #8899bb;
            letter-spacing: 0.04em;
        }
        #controller-mode .ctrl-header .back-btn {
            font-size: 1.6rem;
            line-height: 1;
            padding: 0 0.2rem;
            color: #8899bb;
            transition: color 0.2s;
        }
        #controller-mode .ctrl-header .back-btn:hover {
            color: #fff;
        }

        /* room setup */
        #ctrl-room-setup {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 0;
            gap: 1.4rem;
        }
        #ctrl-room-setup .qr-box {
            background: #fff;
            padding: 0.8rem;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #ctrl-room-setup .qr-box #qrcode {
            width: 100%;
            height: 100%;
        }
        #ctrl-room-setup .room-url {
            font-size: 0.8rem;
            color: #8899bb;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            word-break: break-all;
            max-width: 90%;
            text-align: center;
        }
        #ctrl-room-setup .room-id-display {
            font-size: 1.2rem;
            font-weight: 600;
            color: #4facfe;
            background: rgba(79, 172, 254, 0.12);
            padding: 0.3rem 1.6rem;
            border-radius: 40px;
            letter-spacing: 0.06em;
        }
        #ctrl-room-setup .join-input-group {
            display: flex;
            gap: 0.6rem;
            width: 100%;
            max-width: 320px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #ctrl-room-setup .join-input-group input {
            flex: 1;
            min-width: 140px;
            padding: 0.7rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }
        #ctrl-room-setup .join-input-group input:focus {
            border-color: #4facfe;
        }
        #ctrl-room-setup .join-input-group button {
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0b0e14;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        #ctrl-room-setup .join-input-group button:active {
            transform: scale(0.95);
        }

        /* controller controls */
        #ctrl-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: 1rem;
            gap: 0.8rem;
        }
        #ctrl-controls .slide-preview {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.2rem;
            min-height: 120px;
            position: relative;
        }
        #ctrl-controls .slide-preview .preview-emoji {
            font-size: 2.8rem;
        }
        #ctrl-controls .slide-preview .preview-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 0.2rem;
            color: #e8edf5;
        }
        #ctrl-controls .slide-preview .preview-num {
            position: absolute;
            bottom: 0.6rem;
            right: 1rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
        }
        #ctrl-controls .nav-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            padding: 0.4rem 0;
            flex-shrink: 0;
        }
        #ctrl-controls .nav-buttons button {
            padding: 0.9rem 1.8rem;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 600;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex: 1;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 62px;
        }
        #ctrl-controls .nav-buttons button:active {
            transform: scale(0.93);
        }
        #ctrl-controls .nav-buttons .prev-btn {
            background: rgba(255, 255, 255, 0.05);
        }
        #ctrl-controls .nav-buttons .next-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0b0e14;
        }
        #ctrl-controls .nav-buttons .next-btn:active {
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
        }
        #ctrl-controls .dots-row {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0.2rem 0;
            flex-shrink: 0;
        }
        #ctrl-controls .dots-row .dot-ctrl {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            transition: all 0.25s;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            border: 1px solid transparent;
        }
        #ctrl-controls .dots-row .dot-ctrl.active {
            background: #4facfe;
            color: #0b0e14;
            border-color: #4facfe;
            transform: scale(1.1);
        }
        #ctrl-controls .dots-row .dot-ctrl:active {
            transform: scale(0.85);
        }
        #ctrl-controls .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.4rem;
            flex-shrink: 0;
        }

        /* Volume button hint */
        .volume-hint {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            padding-top: 0.2rem;
            flex-shrink: 0;
            letter-spacing: 0.04em;
        }
        .volume-hint span {
            background: rgba(255, 255, 255, 0.06);
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            margin: 0 0.2rem;
        }

        /* ────────────── Responsive tweaks ────────────── */
        @media (max-width: 600px) {
            #display-mode .slide {
                padding: 2rem 1.5rem;
            }
            #display-mode .slide h2 {
                font-size: 2rem;
            }
            #display-mode .slide p {
                font-size: 0.95rem;
            }
            #display-mode .slide ul li {
                font-size: 0.85rem;
                padding: 0.2rem 1rem;
            }
            #display-mode .slide-indicator {
                bottom: 1.2rem;
                gap: 0.4rem;
                padding: 0.3rem 0.7rem;
            }
            #display-mode .slide-indicator .dot {
                width: 8px;
                height: 8px;
            }
            #display-mode .connection-status {
                left: 0.8rem;
                right: 0.8rem;
                top: 0.8rem;
                padding: 0.3rem 0.8rem;
                font-size: 0.7rem;
            }
            #display-room-id {
                font-size: 0.7rem !important;
                padding: 1px 10px !important;
            }
            #controller-mode {
                padding: 1rem 0.8rem;
            }
            #ctrl-controls .nav-buttons button {
                font-size: 1.2rem;
                min-height: 54px;
                padding: 0.6rem 1rem;
            }
            #ctrl-controls .dots-row .dot-ctrl {
                width: 28px;
                height: 28px;
                font-size: 0.5rem;
            }
            #ctrl-room-setup .qr-box {
                width: 160px;
                height: 160px;
            }
        }
        @media (min-width: 1024px) {
            #controller-mode {
                max-width: 480px;
                margin: 0 auto;
                border-left: 1px solid rgba(255, 255, 255, 0.05);
                border-right: 1px solid rgba(255, 255, 255, 0.05);
            }
        }

        /* ────────────── Utilities ────────────── */
        .fade-in {
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* scrollbar hide */
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
    <div id="app">

        <!-- ─── LANDING ─── -->
        <div id="landing">
            <h1>✦ Present</h1>
            <p class="sub">Display on laptop · Control from phone</p>
            <div class="mode-buttons">
                <button class="mode-btn display-btn" id="btn-display">
                    <span class="icon">🖥️</span> Start Display
                </button>
                <button class="mode-btn controller-btn" id="btn-controller">
                    <span class="icon">📱</span> Open Controller
                </button>
            </div>
            <p style="margin-top:2.4rem;font-size:0.8rem;color:rgba(255,255,255,0.15);">
                Both devices must be on the same network.
            </p>
        </div>

        <!-- ─── DISPLAY MODE (Laptop) ─── -->
        <div id="display-mode" class="hidden">
            <div class="connection-status">
                <span class="led" id="display-led"></span>
                <span id="display-status-text">Connecting…</span>
                <span id="display-room-id"></span>
            </div>
            <div class="slide-number" id="slide-counter">1 / 6</div>

            <div id="slides-container"></div>

            <div class="slide-indicator" id="dot-indicator"></div>
        </div>

        <!-- ─── CONTROLLER MODE (Mobile) ─── -->
        <div id="controller-mode" class="hidden">
            <div class="ctrl-header">
                <button class="back-btn" id="ctrl-back">‹</button>
                <h2>📱 Controller</h2>
                <span class="room-badge" id="ctrl-room-badge">● room</span>
            </div>

            <div id="ctrl-room-setup">
                <div class="qr-box">
                    <div id="qrcode"></div>
                </div>
                <div class="room-id-display" id="ctrl-room-id-display">———</div>
                <div class="room-url" id="ctrl-room-url">Loading…</div>
                <div style="color:rgba(255,255,255,0.2);font-size:0.8rem;margin-top:-0.2rem;">
                    — or enter room ID —
                </div>
                <div class="join-input-group">
                    <input type="text" id="ctrl-room-input" placeholder="Enter laptop Room ID" maxlength="12" />
                    <button id="ctrl-join-btn">Join</button>
                </div>
                <div style="font-size:0.7rem;color:rgba(255,255,255,0.15);margin-top:0.2rem;">
                    Scan QR or enter ID from the display
                </div>
            </div>

            <div id="ctrl-controls" class="hidden">
                <div class="slide-preview" id="ctrl-preview">
                    <span class="preview-emoji" id="ctrl-preview-emoji">📄</span>
                    <span class="preview-title" id="ctrl-preview-title">Slide title</span>
                    <span class="preview-num" id="ctrl-preview-num">1 / 6</span>
                </div>

                <div class="dots-row" id="ctrl-dots"></div>

                <div class="nav-buttons">
                    <button class="prev-btn" id="ctrl-prev">◀ Prev</button>
                    <button class="next-btn" id="ctrl-next">Next ▶</button>
                </div>

                <div class="status-row">
                    <span id="ctrl-conn-status">● Connected</span>
                    <span id="ctrl-slide-info">Slide 1</span>
                </div>
                <!-- NEW: Volume button hint -->
                <div class="volume-hint">
                    🔊 Use <span>Volume Up</span> → Next · <span>Volume Down</span> ← Prev
                </div>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SLIDE DATA
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const slides = [{
            emoji: '🚀',
            title: 'Remote Control Presentation',
            desc: 'Display on your laptop · Control from your phone',
            list: ['No app install', 'Works over Wi-Fi', 'Real-time sync']
        }, {
            emoji: '📡',
            title: 'How It Works',
            desc: 'A WebSocket server connects your devices in the same room.',
            list: ['Laptop shows the slides', 'Phone sends commands', 'Instantly updates']
        }, {
            emoji: '🎯',
            title: 'Features',
            desc: 'Built for smooth, reliable presenting.',
            list: ['Swipe / button navigation', 'Live slide preview', 'Auto-reconnect']
        }, {
            emoji: '🧩',
            title: 'Room System',
            desc: 'Each presentation gets a unique Room ID.',
            list: ['QR code for quick join', 'Manual entry supported', 'Private & secure']
        }, {
            emoji: '⚡',
            title: 'Real-Time Control',
            desc: 'Every tap on your phone is reflected instantly on the big screen.',
            list: ['Low latency', 'Smooth transitions', 'Works on any browser']
        }, {
            emoji: '🎬',
            title: 'Ready to Present',
            desc: 'You\'re all set. Use the buttons below to navigate.',
            list: ['← Prev / Next →', 'Tap dots to jump', 'Enjoy the show!']
        }];

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let currentSlide = 0;
        let roomId = '';
        let ws = null;
        let isDisplay = false;
        let isController = false;
        let reconnectTimer = null;
        let ctrlSlideCount = slides.length;

        // DOM refs
        const $ = id => document.getElementById(id);
        const landing = $('landing');
        const displayMode = $('display-mode');
        const controllerMode = $('controller-mode');
        const slidesContainer = $('slides-container');
        const dotIndicator = $('dot-indicator');
        const slideCounter = $('slide-counter');
        const displayLed = $('display-led');
        const displayStatusText = $('display-status-text');
        const displayRoomId = $('display-room-id');

        const ctrlRoomSetup = $('ctrl-room-setup');
        const ctrlControls = $('ctrl-controls');
        const ctrlRoomIdDisplay = $('ctrl-room-id-display');
        const ctrlRoomUrl = $('ctrl-room-url');
        const ctrlRoomInput = $('ctrl-room-input');
        const ctrlJoinBtn = $('ctrl-join-btn');
        const ctrlBack = $('ctrl-back');
        const ctrlRoomBadge = $('ctrl-room-badge');
        const ctrlPreviewEmoji = $('ctrl-preview-emoji');
        const ctrlPreviewTitle = $('ctrl-preview-title');
        const ctrlPreviewNum = $('ctrl-preview-num');
        const ctrlDots = $('ctrl-dots');
        const ctrlPrev = $('ctrl-prev');
        const ctrlNext = $('ctrl-next');
        const ctrlConnStatus = $('ctrl-conn-status');
        const ctrlSlideInfo = $('ctrl-slide-info');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  BUILD SLIDES (Display)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function buildSlides() {
            slidesContainer.innerHTML = '';
            slides.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = `slide${i === 0 ? ' active' : ''}`;
                div.dataset.index = i;
                let listHtml = '';
                if (s.list) {
                    listHtml = `<ul>${s.list.map(item => `<li>${item}</li>`).join('')}</ul>`;
                }
                div.innerHTML = `
              <span class="emoji">${s.emoji}</span>
              <h2>${s.title}</h2>
              <p>${s.desc}</p>
              ${listHtml}
            `;
                slidesContainer.appendChild(div);
            });
            dotIndicator.innerHTML = '';
            slides.forEach((_, i) => {
                const dot = document.createElement('span');
                dot.className = `dot${i === 0 ? ' active' : ''}`;
                dot.dataset.index = i;
                dotIndicator.appendChild(dot);
            });
            updateDisplayUI();
        }

        function updateDisplayUI() {
            const allSlides = slidesContainer.querySelectorAll('.slide');
            const dots = dotIndicator.querySelectorAll('.dot');
            allSlides.forEach((el, i) => {
                el.classList.toggle('active', i === currentSlide);
            });
            dots.forEach((el, i) => {
                el.classList.toggle('active', i === currentSlide);
            });
            slideCounter.textContent = `${currentSlide + 1} / ${slides.length}`;
        }

        function goToSlide(index) {
            if (index < 0) index = 0;
            if (index >= slides.length) index = slides.length - 1;
            if (index === currentSlide) return;
            currentSlide = index;
            updateDisplayUI();
            if (isDisplay && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'sync', slide: currentSlide }));
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONTROLLER UI UPDATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateControllerUI(index) {
            const s = slides[index] || slides[0];
            ctrlPreviewEmoji.textContent = s.emoji;
            ctrlPreviewTitle.textContent = s.title;
            ctrlPreviewNum.textContent = `${index + 1} / ${slides.length}`;
            ctrlSlideInfo.textContent = `Slide ${index + 1}`;

            ctrlDots.innerHTML = '';
            slides.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.className = `dot-ctrl${i === index ? ' active' : ''}`;
                btn.textContent = i + 1;
                btn.dataset.index = i;
                btn.addEventListener('click', () => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'goto', slide: i }));
                    }
                });
                ctrlDots.appendChild(btn);
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  WEBSOCKET
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getWebSocketUrl() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            return `${proto}//${host}`;
        }

        function connectWebSocket(mode, room) {
            if (ws) {
                try { ws.close(); } catch (_) {}
                ws = null;
            }
            const url = getWebSocketUrl();
            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log(`[WS] Connected as ${mode} in room ${room}`);
                ws.send(JSON.stringify({ type: 'join', mode, room }));
                if (isDisplay) {
                    displayLed.className = 'led';
                    displayStatusText.textContent = '✅ Connected';
                    ws.send(JSON.stringify({ type: 'sync', slide: currentSlide }));
                }
                if (isController) {
                    ctrlConnStatus.textContent = '● Connected';
                    ctrlConnStatus.style.color = '#4facfe';
                    ctrlRoomBadge.textContent = `● ${room}`;
                }
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    handleWebSocketMessage(data);
                } catch (err) {
                    console.warn('WS parse error:', err);
                }
            };

            ws.onclose = () => {
                console.log('[WS] Disconnected');
                if (isDisplay) {
                    displayLed.className = 'led off';
                    displayStatusText.textContent = 'Disconnected — reconnecting…';
                }
                if (isController) {
                    ctrlConnStatus.textContent = '● Disconnected';
                    ctrlConnStatus.style.color = '#f5576c';
                }
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => {
                    if (roomId) {
                        connectWebSocket(isDisplay ? 'display' : 'controller', roomId);
                    }
                }, 2000);
            };

            ws.onerror = () => {
                console.warn('[WS] Error');
            };
        }

        function handleWebSocketMessage(data) {
            if (data.type === 'sync' && typeof data.slide === 'number') {
                if (isController) {
                    currentSlide = data.slide;
                    updateControllerUI(currentSlide);
                }
            }
            if (data.type === 'goto' && typeof data.slide === 'number') {
                if (isDisplay) {
                    goToSlide(data.slide);
                }
            }
            if (data.type === 'next') {
                if (isDisplay) {
                    goToSlide(currentSlide + 1);
                }
            }
            if (data.type === 'prev') {
                if (isDisplay) {
                    goToSlide(currentSlide - 1);
                }
            }
            if (data.type === 'welcome') {
                if (data.slide !== undefined && isController) {
                    currentSlide = data.slide;
                    updateControllerUI(currentSlide);
                }
            }
            if (data.type === 'joined') {
                if (data.slide !== undefined && isController) {
                    currentSlide = data.slide;
                    updateControllerUI(currentSlide);
                    ctrlRoomSetup.classList.add('hidden');
                    ctrlControls.classList.remove('hidden');
                }
            }
            if (data.type === 'room_full') {
                alert('This room is already in use. Please create a new room.');
                if (isController) {
                    resetControllerUI();
                }
            }
            if (data.type === 'room_not_found') {
                alert('Room not found. Please check the Room ID and try again.');
                if (isController) {
                    resetControllerUI();
                }
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  VOLUME BUTTON CONTROLS (NEW)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function handleVolumeKeys(e) {
            // Only work if controller is active, connected, and controls are visible
            if (!isController || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (ctrlControls.classList.contains('hidden')) return;

            const key = e.key;
            // Check for volume keys using both modern 'key' and legacy 'keyCode'
            if (key === 'VolumeUp' || key === 'AudioVolumeUp' || e.keyCode === 175) {
                e.preventDefault(); // Try to prevent system volume popup
                ws.send(JSON.stringify({ type: 'next' }));
                // Visual feedback: flash the Next button
                ctrlNext.style.transform = 'scale(0.92)';
                setTimeout(() => ctrlNext.style.transform = '', 150);
            } else if (key === 'VolumeDown' || key === 'AudioVolumeDown' || e.keyCode === 174) {
                e.preventDefault();
                ws.send(JSON.stringify({ type: 'prev' }));
                ctrlPrev.style.transform = 'scale(0.92)';
                setTimeout(() => ctrlPrev.style.transform = '', 150);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DISPLAY MODE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function startDisplay() {
            isDisplay = true;
            isController = false;
            landing.classList.add('hidden');
            displayMode.classList.remove('hidden');
            controllerMode.classList.add('hidden');
            buildSlides();
            roomId = generateRoomId();
            displayRoomId.textContent = roomId;
            displayStatusText.textContent = 'Connecting…';
            displayLed.className = 'led off';
            connectWebSocket('display', roomId);
            console.log(`📡 Display room: ${roomId}`);
            slideCounter.textContent = `1 / ${slides.length}`;
            document.addEventListener('keydown', handleDisplayKeys);
        }

        function handleDisplayKeys(e) {
            if (!isDisplay) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
                e.preventDefault();
                goToSlide(currentSlide + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToSlide(currentSlide - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                goToSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                goToSlide(slides.length - 1);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONTROLLER MODE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function startController() {
            isController = true;
            isDisplay = false;
            landing.classList.add('hidden');
            controllerMode.classList.remove('hidden');
            displayMode.classList.add('hidden');
            ctrlRoomSetup.classList.remove('hidden');
            ctrlControls.classList.add('hidden');

            const tempRoom = generateRoomId();
            ctrlRoomIdDisplay.textContent = tempRoom;
            ctrlRoomBadge.textContent = `● ${tempRoom}`;
            const url = window.location.href.split('?')[0].split('#')[0];
            const fullUrl = url + '?room=' + tempRoom + '&mode=display';
            ctrlRoomUrl.textContent = fullUrl;
            try {
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: fullUrl,
                    width: 200,
                    height: 200,
                    colorDark: '#0b0e14',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (_) {
                document.getElementById('qrcode').innerHTML = '<div style="color:#000;font-size:0.8rem;text-align:center;">QR code<br/>unavailable</div>';
            }
            roomId = tempRoom;
            ctrlRoomInput.value = '';
            ctrlRoomInput.placeholder = 'Enter laptop Room ID here';

            // 🔥 NEW: Attach volume key listener for controller
            window.addEventListener('keydown', handleVolumeKeys);
        }

        function joinControllerRoom(room) {
            if (!room || room.length < 3) {
                alert('Please enter a valid Room ID.');
                return;
            }
            roomId = room.trim().toUpperCase();
            ctrlRoomIdDisplay.textContent = roomId;
            ctrlRoomBadge.textContent = `● ${roomId}`;
            connectWebSocket('controller', roomId);
            ctrlConnStatus.textContent = '● Connecting…';
            ctrlConnStatus.style.color = '#f5a623';
        }

        function resetControllerUI() {
            ctrlRoomSetup.classList.remove('hidden');
            ctrlControls.classList.add('hidden');
            if (ws) {
                try { ws.close(); } catch (_) {}
                ws = null;
            }
            roomId = '';
            ctrlRoomBadge.textContent = '● room';
            ctrlConnStatus.textContent = '● Disconnected';
            ctrlConnStatus.style.color = '#f5576c';

            // 🔥 NEW: Remove volume key listener on cleanup
            window.removeEventListener('keydown', handleVolumeKeys);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function generateRoomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
                if (i === 2) result += '-';
            }
            return result;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT BINDINGS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.addEventListener('DOMContentLoaded', () => {
            $('btn-display').addEventListener('click', startDisplay);
            $('btn-controller').addEventListener('click', startController);

            ctrlJoinBtn.addEventListener('click', () => {
                const val = ctrlRoomInput.value.trim().toUpperCase();
                if (val) {
                    joinControllerRoom(val);
                } else {
                    const displayed = ctrlRoomIdDisplay.textContent;
                    if (displayed && displayed !== '———') {
                        joinControllerRoom(displayed);
                    } else {
                        alert('Please enter a Room ID or scan the QR code.');
                    }
                }
            });
            ctrlRoomInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') ctrlJoinBtn.click();
            });

            ctrlPrev.addEventListener('click', () => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'prev' }));
                }
            });
            ctrlNext.addEventListener('click', () => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'next' }));
                }
            });

            ctrlBack.addEventListener('click', () => {
                if (ws) {
                    try { ws.close(); } catch (_) {}
                    ws = null;
                }
                isController = false;
                isDisplay = false;
                roomId = '';
                controllerMode.classList.add('hidden');
                landing.classList.remove('hidden');
                resetControllerUI();
                document.removeEventListener('keydown', handleDisplayKeys);
                window.removeEventListener('keydown', handleVolumeKeys);
            });

            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            const modeParam = params.get('mode');
            if (roomParam && modeParam === 'display') {
                startDisplay();
                roomId = roomParam.toUpperCase();
                if (ws) {
                    try { ws.close(); } catch (_) {}
                    ws = null;
                }
                connectWebSocket('display', roomId);
                displayStatusText.textContent = `Room: ${roomId} — connecting…`;
            } else if (roomParam) {
                startController();
                ctrlRoomInput.value = roomParam.toUpperCase();
                setTimeout(() => {
                    if (isController && roomId && ctrlRoomInput.value.trim().toUpperCase() === roomParam.toUpperCase()) {
                        joinControllerRoom(roomParam.toUpperCase());
                    }
                }, 600);
            }

            document.addEventListener('touchend', (e) => {
                if (e.target.closest('button')) {
                    e.preventDefault();
                    e.target.click();
                }
            }, { passive: false });
        });

        console.log('✨ Remote Control Presentation loaded with volume key support!');
        console.log('📱 On your phone, use Volume Up/Down to navigate slides.');
    </script>
</body>
</html>
