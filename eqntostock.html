<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Simulator · Circuits & Trade Changes</title>
    <style>
        /* ─── reset & base ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f5fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.02);
            padding: 28px 32px 36px;
            max-width: 960px;
            width: 100%;
            transition: box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 18px;
        }

        .title-group h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .title-group h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #5b6f87;
            word-break: break-all;
        }

        .title-group .sub {
            font-size: 14px;
            color: #6b7f99;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .title-group .sub .badge {
            background: #eef3f9;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #2c4a6e;
            font-weight: 500;
        }

        .title-group .sub .badge.even {
            background: #d4edda;
            color: #1d6e46;
        }

        .title-group .sub .badge.odd {
            background: #f8d7da;
            color: #9e3d3d;
        }

        .title-group .sub .badge.circuit-hit {
            background: #fff3cd;
            color: #856404;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls label {
            font-size: 13px;
            font-weight: 500;
            color: #3a4f68;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls input[type="number"] {
            width: 58px;
            padding: 6px 8px;
            border: 1.5px solid #d7e0e9;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            background: #f8faff;
            color: #0b1a2e;
            transition: border 0.15s;
            outline: none;
        }

        .controls input[type="number"]:focus {
            border-color: #4a8ed9;
            box-shadow: 0 0 0 3px rgba(74, 142, 217, 0.12);
        }

        .controls input[type="number"].small {
            width: 70px;
        }

        .controls input[type="text"] {
            padding: 6px 10px;
            border: 1.5px solid #d7e0e9;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            background: #f8faff;
            color: #0b1a2e;
            transition: border 0.15s;
            outline: none;
            font-family: 'Courier New', monospace;
            width: 160px;
        }

        .controls input[type="text"]:focus {
            border-color: #4a8ed9;
            box-shadow: 0 0 0 3px rgba(74, 142, 217, 0.12);
        }

        .controls select {
            padding: 6px 10px;
            border: 1.5px solid #d7e0e9;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            background: #f8faff;
            color: #0b1a2e;
            outline: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            max-width: 170px;
        }

        .controls select:focus {
            border-color: #4a8ed9;
            box-shadow: 0 0 0 3px rgba(74, 142, 217, 0.12);
        }

        .btn {
            background: #1d2b3f;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.18s, transform 0.08s, box-shadow 0.18s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .btn:hover {
            background: #2a3d56;
            box-shadow: 0 4px 14px rgba(29, 43, 63, 0.18);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn.danger {
            background: #b64a4a;
        }
        .btn.danger:hover {
            background: #9e3d3d;
        }
        .btn.success {
            background: #2d8f5c;
        }
        .btn.success:hover {
            background: #237a4c;
        }
        .btn.primary {
            background: #2b6bb0;
        }
        .btn.primary:hover {
            background: #1f5a9a;
        }

        .btn .icon {
            font-size: 16px;
            line-height: 1;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #eaf0f6;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 480;
            background: #ffffff;
            cursor: crosshair;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin-top: 18px;
        }

        .stats {
            display: flex;
            gap: 18px 28px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #3f566e;
        }

        .stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stats .num {
            font-weight: 600;
            color: #0b1a2e;
            font-variant-numeric: tabular-nums;
        }

        .stats .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 2px;
        }

        .dot.green {
            background: #00a859;
        }
        .dot.red {
            background: #e84141;
        }
        .dot.gray {
            background: #b0c4db;
        }
        .dot.daily {
            background: #4a8ed9;
        }
        .dot.total {
            background: #8a6e3b;
        }
        .dot.trade {
            background: #8b5cf6;
        }

        .legend {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #3f566e;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-item .swatch {
            width: 20px;
            height: 3px;
            border-radius: 4px;
        }

        .swatch.up {
            background: #00a859;
        }
        .swatch.down {
            background: #e84141;
        }
        .swatch.ma {
            background: #8aa3c0;
            border: 1px dashed #6a82a0;
            height: 0;
            border-top: 2px dashed #8aa3c0;
            width: 20px;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 500;
            padding: 3px 12px;
            border-radius: 20px;
            background: #e8edf4;
            color: #3a4f68;
        }

        .status-badge.playing {
            background: #d4edda;
            color: #1d6e46;
        }

        /* ─── tooltip ─── */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: #0b1a2e;
            color: #f0f6fe;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transition: opacity 0.15s;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
            z-index: 10;
            white-space: nowrap;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip .label {
            font-weight: 400;
            color: #b8cee8;
        }

        /* ─── responsive ─── */
        @media (max-width: 680px) {
            .card {
                padding: 20px 16px 24px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .title-group h1 {
                font-size: 22px;
            }
            .controls {
                justify-content: flex-start;
            }
            .controls label {
                font-size: 12px;
            }
            .controls input[type="text"] {
                width: 120px;
            }
            .controls select {
                max-width: 120px;
            }
            .footer {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .stats {
                justify-content: space-between;
                font-size: 12px;
                gap: 6px 14px;
            }
            .legend {
                font-size: 12px;
                flex-wrap: wrap;
            }
            .btn {
                padding: 6px 14px;
                font-size: 13px;
            }
        }

        @media (max-width: 420px) {
            .stats {
                flex-direction: column;
                gap: 4px;
            }
            .legend {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- header -->
        <div class="header">
            <div class="title-group">
                <h1>
                    📈 Stock Simulator
                    <small id="functionTitle">return = Math.sin(x)</small>
                </h1>
                <div class="sub">
                    <span>custom return · circuits · trade/day changes</span>
                    <span class="badge" id="biasDisplay">Day 0 (Neutral)</span>
                    <span class="badge" id="statusBadge">⏸ paused</span>
                    <span class="badge" id="circuitBadge" style="display:none;">⚡ Circuit hit</span>
                </div>
            </div>
            <div class="controls">
                <label>
                    f(x) =
                    <select id="equationSelect">
                        <option value="Math.sin(x)">sin(x)</option>
                        <option value="Math.cos(x)">cos(x)</option>
                        <option value="Math.sin(x) + Math.cos(x)">sin+cos</option>
                        <option value="Math.sin(x) - Math.cos(x)">sin−cos</option>
                        <option value="Math.sin(x) * Math.cos(x)">sin·cos</option>
                        <option value="Math.sin(2*x)">sin(2x)</option>
                        <option value="Math.cos(2*x)">cos(2x)</option>
                        <option value="Math.sin(x) + 0.5">sin+0.5</option>
                        <option value="Math.cos(x) - 0.5">cos−0.5</option>
                        <option value="0.5 * Math.sin(x)">0.5·sin</option>
                        <option value="0.5 * Math.cos(x)">0.5·cos</option>
                        <option value="Math.sin(x) * Math.cos(x) + 0.3">sin·cos+0.3</option>
                        <option value="Math.sin(x) + Math.cos(2*x)">sin+cos(2x)</option>
                        <option value="Math.cos(x) - Math.sin(2*x)">cos−sin(2x)</option>
                        <option value="Math.sin(x) + Math.sin(2*x)">sin+sin(2x)</option>
                        <option value="Math.cos(x) + Math.cos(2*x)">cos+cos(2x)</option>
                        <option value="Math.sin(x) + 0.2 * Math.sin(2*x)">sin+0.2·sin(2x)</option>
                        <option value="Math.cos(x) + 0.3 * Math.cos(2*x)">cos+0.3·cos(2x)</option>
                        <option value="Math.sin(x) * (1 + 0.5 * Math.cos(x))">sin·(1+0.5cos)</option>
                        <option value="Math.cos(x) * (1 + 0.5 * Math.sin(x))">cos·(1+0.5sin)</option>
                    </select>
                </label>
                <input type="text" id="equationInput" value="Math.sin(x)" style="width:140px;" />
                <button class="btn primary" id="applyEqBtn">Apply</button>
                <label>
                    upper %
                    <input type="number" id="upperCircuit" value="5" min="0.5" max="20" step="0.5" style="width:50px;" />
                </label>
                <label>
                    lower %
                    <input type="number" id="lowerCircuit" value="5" min="0.5" max="20" step="0.5" style="width:50px;" />
                </label>
                <label>
                    delay (ms)
                    <input type="number" id="intervalInput" value="1000" min="200" max="5000" step="100" class="small" />
                </label>
                <label>
                    window
                    <input type="number" id="maxPointsInput" value="80" min="4" max="150" />
                </label>
                <button class="btn success" id="playBtn"><span class="icon">▶</span> Play</button>
                <button class="btn" id="generateBtn"><span class="icon">⟳</span> Reset</button>
            </div>
        </div>

        <!-- canvas -->
        <div class="canvas-wrapper">
            <canvas id="graph" width="800" height="480"></canvas>
            <div class="tooltip" id="tooltip"></div>
        </div>

        <!-- footer -->
        <div class="footer">
            <div class="stats">
                <span>
                    <span class="dot green"></span>
                    points
                    <span class="num" id="pointCountDisplay">0</span>
                </span>
                <span>
                    time range
                    <span class="num" id="rangeDisplay">0 … 0</span>
                </span>
                <span>
                    price range
                    <span class="num" id="priceRangeDisplay">–</span>
                </span>
                <span>
                    <span class="dot gray"></span>
                    updates
                    <span class="num" id="updateCountDisplay">0</span>
                </span>
                <span>
                    <span class="dot trade" id="tradeDot"></span>
                    trade
                    <span class="num" id="tradeChangeDisplay">+0.00</span>
                </span>
                <span>
                    <span class="dot daily" id="dailyDot"></span>
                    day
                    <span class="num" id="dailyChangeDisplay">+0.00</span>
                </span>
                <span>
                    <span class="dot total" id="totalDot"></span>
                    total
                    <span class="num" id="totalChangeDisplay">+0.00</span>
                </span>
            </div>
            <div class="legend">
                <span class="legend-item">
                    <span class="swatch up"></span> up
                </span>
                <span class="legend-item">
                    <span class="swatch down"></span> down
                </span>
                <span class="legend-item">
                    <span class="swatch ma"></span> moving average
                </span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────────────────
            const canvas = document.getElementById('graph');
            const ctx = canvas.getContext('2d');
            const tooltip = document.getElementById('tooltip');
            const pointCountInput = document.getElementById('maxPointsInput');
            const intervalInput = document.getElementById('intervalInput');
            const generateBtn = document.getElementById('generateBtn');
            const playBtn = document.getElementById('playBtn');
            const applyEqBtn = document.getElementById('applyEqBtn');
            const equationInput = document.getElementById('equationInput');
            const equationSelect = document.getElementById('equationSelect');
            const functionTitle = document.getElementById('functionTitle');
            const pointCountDisplay = document.getElementById('pointCountDisplay');
            const rangeDisplay = document.getElementById('rangeDisplay');
            const priceRangeDisplay = document.getElementById('priceRangeDisplay');
            const updateCountDisplay = document.getElementById('updateCountDisplay');
            const statusBadge = document.getElementById('statusBadge');
            const biasDisplay = document.getElementById('biasDisplay');
            const circuitBadge = document.getElementById('circuitBadge');

            const dailyChangeDisplay = document.getElementById('dailyChangeDisplay');
            const totalChangeDisplay = document.getElementById('totalChangeDisplay');
            const tradeChangeDisplay = document.getElementById('tradeChangeDisplay');
            const dailyDot = document.getElementById('dailyDot');
            const totalDot = document.getElementById('totalDot');
            const tradeDot = document.getElementById('tradeDot');

            const upperCircuitInput = document.getElementById('upperCircuit');
            const lowerCircuitInput = document.getElementById('lowerCircuit');

            // ─── constants ────────────────────────────────────────────
            const W = 800,
                H = 480;
            const PAD = { top: 32, right: 36, bottom: 44, left: 52 };
            const PLOT_W = W - PAD.left - PAD.right;
            const PLOT_H = H - PAD.top - PAD.bottom;

            const GREEN = '#00a859';
            const RED = '#e84141';
            const GREEN_FILL = 'rgba(0, 168, 89, 0.15)';
            const RED_FILL = 'rgba(232, 65, 65, 0.15)';
            const MOVING_AVG_COLOR = '#8aa3c0';

            const INITIAL_PRICE = 100;
            const SCALE = 0.02;

            // ─── state ────────────────────────────────────────────────
            let data = [];
            let maxPoints = 80;
            let intervalDelay = 1000;
            let isPlaying = false;
            let autoIntervalId = null;
            let updateCounter = 0;
            let timeCounter = 0;

            let userEquation = 'Math.sin(x)';
            let evalFn = null;

            // Day tracking
            let currentDay = new Date().getDate();
            let dayStartPrice = INITIAL_PRICE;

            // Circuit breakers (percentage, e.g., 5 for 5%)
            let upperCircuitPct = 5;
            let lowerCircuitPct = 5;

            // Circuit hit flag
            let circuitHit = false;

            // ─── helpers ──────────────────────────────────────────────
            function rand(min, max) {
                return Math.random() * (max - min) + min;
            }

            function lerp(a, b, t) { return a + (b - a) * t; }

            function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }

            // ─── equation compiler ────────────────────────────────────
            function compileEquation(expr) {
                try {
                    const fn = new Function('x', `return (${expr});`);
                    const test = fn(0);
                    if (typeof test !== 'number' || !isFinite(test)) {
                        throw new Error('Invalid output');
                    }
                    return fn;
                } catch (e) {
                    console.warn('Invalid equation, falling back to Math.sin(x)', e);
                    return new Function('x', 'return Math.sin(x);');
                }
            }

            // ─── random generators ────────────────────────────────────
            function getBiasedRandom() {
                const date = new Date();
                const day = date.getDate();
                const isEven = day % 2 === 0;
                const biasStrength = 0.40;
                if (Math.random() < biasStrength) {
                    return isEven ? rand(0, Math.PI) : rand(-Math.PI, 0);
                } else {
                    return rand(-2 * Math.PI, 2 * Math.PI);
                }
            }

            function getUnbiasedRandom() {
                return rand(-2 * Math.PI, 2 * Math.PI);
            }

            function updateBiasDisplay() {
                const date = new Date();
                const day = date.getDate();
                const isEven = day % 2 === 0;
                const biasText = isEven ? '📈 Positive' : '📉 Negative';
                const cssClass = isEven ? 'even' : 'odd';
                biasDisplay.textContent = `Day ${day} (${biasText})`;
                biasDisplay.className = `badge ${cssClass}`;
            }

            function updateTitle() {
                const displayEq = userEquation.length > 30 ? userEquation.slice(0, 28) + '…' : userEquation;
                functionTitle.textContent = `return = ${displayEq}`;
            }

            // ─── price generation with circuits ──────────────────────
            function generateNextPrice(prevPrice) {
                // Try biased random first
                let ret = 0;
                let x = getBiasedRandom();
                try { ret = evalFn(x); } catch (e) { ret = 0; }
                let rawChangePct = ret * SCALE; // percentage change as decimal

                // Check if raw change would exceed circuit limits
                const upperLimit = upperCircuitPct / 100;
                const lowerLimit = -lowerCircuitPct / 100;
                let finalChangePct = rawChangePct;
                let usedUnbiased = false;

                if (rawChangePct > upperLimit || rawChangePct < lowerLimit) {
                    // Circuit would be hit: use unbiased random
                    usedUnbiased = true;
                    x = getUnbiasedRandom();
                    try { ret = evalFn(x); } catch (e) { ret = 0; }
                    rawChangePct = ret * SCALE;
                    // Now cap to circuit limits
                    finalChangePct = clamp(rawChangePct, lowerLimit, upperLimit);
                    // Record that circuit was hit
                    circuitHit = true;
                } else {
                    circuitHit = false;
                }

                const newPrice = Math.max(prevPrice * (1 + finalChangePct), 1);
                return { price: newPrice, changePct: finalChangePct, circuitHit: circuitHit, usedUnbiased: usedUnbiased };
            }

            // ─── generate initial data ──────────────────────────────
            function generateInitialData(count) {
                const pts = [];
                let price = INITIAL_PRICE;
                for (let i = 0; i < count; i++) {
                    pts.push({ t: i, price: price });
                    if (i < count - 1) {
                        const result = generateNextPrice(price);
                        price = result.price;
                    }
                }
                timeCounter = count - 1;
                const now = new Date();
                currentDay = now.getDate();
                dayStartPrice = pts.length > 0 ? pts[0].price : INITIAL_PRICE;
                circuitHit = false;
                return pts;
            }

            // ─── add a point and trim ─────────────────────────────────
            function addPointAndTrim() {
                const prevPrice = data[data.length - 1].price;
                const result = generateNextPrice(prevPrice);
                const newPrice = result.price;
                const now = new Date();
                const newDay = now.getDate();
                if (newDay !== currentDay) {
                    // Day changed: update dayStartPrice to the last price before pushing new point
                    dayStartPrice = prevPrice;
                    currentDay = newDay;
                }
                timeCounter++;
                data.push({ t: timeCounter, price: newPrice });
                if (data.length > maxPoints) {
                    data.shift();
                }
                updateCounter++;

                // Show circuit hit badge if applicable
                if (result.circuitHit) {
                    circuitBadge.style.display = 'inline-block';
                    setTimeout(() => {
                        circuitBadge.style.display = 'none';
                    }, 3000);
                }
            }

            // ─── compute moving average ─────────────────────────────
            function computeMovingAverage(pts, window = 5) {
                if (pts.length < window) return [];
                const result = [];
                for (let i = 0; i < pts.length; i++) {
                    if (i < window - 1) {
                        result.push(null);
                    } else {
                        let sum = 0;
                        for (let j = i - window + 1; j <= i; j++) {
                            sum += pts[j].price;
                        }
                        result.push(sum / window);
                    }
                }
                return result;
            }

            // ─── mapping ──────────────────────────────────────────────
            function toCanvasX(x, xMin, xMax) {
                if (xMin === xMax) return PAD.left + PLOT_W / 2;
                const t = (x - xMin) / (xMax - xMin);
                return PAD.left + t * PLOT_W;
            }

            function toCanvasY(y, yMin, yMax) {
                if (yMin === yMax) return PAD.top + PLOT_H / 2;
                const t = (y - yMin) / (yMax - yMin);
                return PAD.top + PLOT_H - t * PLOT_H;
            }

            // ─── draw ──────────────────────────────────────────────────
            function draw(pts, highlightIndex = -1) {
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);

                if (pts.length === 0) {
                    ctx.fillStyle = '#b0c4db';
                    ctx.font = '16px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('No data — press Reset or Play', W / 2, H / 2);
                    return;
                }

                const xMin = pts[0].t;
                const xMax = pts[pts.length - 1].t;
                const range = xMax - xMin;

                let yMin = Infinity,
                    yMax = -Infinity;
                for (const p of pts) {
                    if (p.price < yMin) yMin = p.price;
                    if (p.price > yMax) yMax = p.price;
                }
                const padding = (yMax - yMin) * 0.08 || 1;
                yMin = Math.max(yMin - padding, 0);
                yMax = yMax + padding;

                // ── grid ──
                ctx.save();
                let xTickStep = 1;
                if (range > 20) xTickStep = 5;
                if (range > 80) xTickStep = 10;
                if (range > 200) xTickStep = 25;
                if (range > 500) xTickStep = 50;
                const target = range / 8;
                const magnitudes = [1, 2, 5, 10, 20, 50, 100];
                let best = magnitudes[0];
                for (const m of magnitudes) {
                    if (target / m >= 0.8) best = m;
                    else break;
                }
                xTickStep = best;

                ctx.strokeStyle = '#e8eef5';
                ctx.lineWidth = 0.8;

                let firstTick = Math.ceil(xMin / xTickStep) * xTickStep;
                for (let t = firstTick; t <= xMax; t += xTickStep) {
                    const cx = toCanvasX(t, xMin, xMax);
                    ctx.beginPath();
                    ctx.moveTo(cx, PAD.top);
                    ctx.lineTo(cx, H - PAD.bottom);
                    ctx.stroke();
                }

                const yTicks = 6;
                for (let i = 0; i <= yTicks; i++) {
                    const t = i / yTicks;
                    const y = lerp(yMin, yMax, t);
                    const cy = toCanvasY(y, yMin, yMax);
                    ctx.beginPath();
                    ctx.moveTo(PAD.left, cy);
                    ctx.lineTo(W - PAD.right, cy);
                    ctx.stroke();
                }
                ctx.restore();

                // ── axes ──
                ctx.save();
                ctx.strokeStyle = '#2c3f57';
                ctx.lineWidth = 1.6;

                const y0 = toCanvasY(0, yMin, yMax);
                ctx.beginPath();
                ctx.moveTo(PAD.left, y0);
                ctx.lineTo(W - PAD.right + 8, y0);
                ctx.stroke();

                const xAxisY = H - PAD.bottom;
                ctx.beginPath();
                ctx.moveTo(PAD.left, xAxisY);
                ctx.lineTo(W - PAD.right + 8, xAxisY);
                ctx.stroke();

                ctx.fillStyle = '#2c3f57';
                ctx.beginPath();
                ctx.moveTo(W - PAD.right + 8, y0);
                ctx.lineTo(W - PAD.right, y0 - 4);
                ctx.lineTo(W - PAD.right, y0 + 4);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(W - PAD.right + 8, xAxisY);
                ctx.lineTo(W - PAD.right, xAxisY - 4);
                ctx.lineTo(W - PAD.right, xAxisY + 4);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#1f3349';
                ctx.font = '13px Inter, -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('time (steps)', W / 2, H - 16);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('price', PAD.left - 28, PAD.top + 4);

                ctx.font = '11px Inter, -apple-system, sans-serif';
                ctx.fillStyle = '#4d657f';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                let tick = firstTick;
                while (tick <= xMax) {
                    const cx = toCanvasX(tick, xMin, xMax);
                    ctx.fillText(tick.toString(), cx, xAxisY + 6);
                    tick += xTickStep;
                }

                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                for (let i = 0; i <= yTicks; i++) {
                    const t = i / yTicks;
                    const y = lerp(yMin, yMax, t);
                    const cy = toCanvasY(y, yMin, yMax);
                    ctx.fillText(y.toFixed(2), PAD.left - 10, cy);
                }
                ctx.restore();

                // ── AREA FILL ──
                const bottomY = PAD.top + PLOT_H;
                for (let i = 0; i < pts.length - 1; i++) {
                    const p1 = pts[i];
                    const p2 = pts[i + 1];
                    const isUp = p2.price >= p1.price;
                    const color = isUp ? GREEN_FILL : RED_FILL;

                    const c1x = toCanvasX(p1.t, xMin, xMax);
                    const c1y = toCanvasY(p1.price, yMin, yMax);
                    const c2x = toCanvasX(p2.t, xMin, xMax);
                    const c2y = toCanvasY(p2.price, yMin, yMax);

                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(c1x, c1y);
                    ctx.lineTo(c2x, c2y);
                    ctx.lineTo(c2x, bottomY);
                    ctx.lineTo(c1x, bottomY);
                    ctx.closePath();
                    ctx.fill();
                }

                // ── MOVING AVERAGE ──
                const maWindow = Math.min(5, pts.length);
                const ma = computeMovingAverage(pts, maWindow);
                ctx.save();
                ctx.strokeStyle = MOVING_AVG_COLOR;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                let started = false;
                for (let i = 0; i < ma.length; i++) {
                    if (ma[i] === null) continue;
                    const cx = toCanvasX(pts[i].t, xMin, xMax);
                    const cy = toCanvasY(ma[i], yMin, yMax);
                    if (!started) {
                        ctx.moveTo(cx, cy);
                        started = true;
                    } else {
                        ctx.lineTo(cx, cy);
                    }
                }
                ctx.stroke();
                ctx.restore();

                // ── LINE STROKES ──
                for (let i = 0; i < pts.length - 1; i++) {
                    const p1 = pts[i];
                    const p2 = pts[i + 1];
                    const isUp = p2.price >= p1.price;
                    const color = isUp ? GREEN : RED;

                    const c1x = toCanvasX(p1.t, xMin, xMax);
                    const c1y = toCanvasY(p1.price, yMin, yMax);
                    const c2x = toCanvasX(p2.t, xMin, xMax);
                    const c2y = toCanvasY(p2.price, yMin, yMax);

                    ctx.save();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2.8;
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';
                    ctx.shadowColor = isUp ? 'rgba(0,168,89,0.15)' : 'rgba(232,65,65,0.15)';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.moveTo(c1x, c1y);
                    ctx.lineTo(c2x, c2y);
                    ctx.stroke();
                    ctx.restore();
                }

                // ── POINTS ──
                for (let i = 0; i < pts.length; i++) {
                    const cx = toCanvasX(pts[i].t, xMin, xMax);
                    const cy = toCanvasY(pts[i].price, yMin, yMax);
                    const isHighlight = (i === highlightIndex);
                    const isUp = (i > 0) ? pts[i].price >= pts[i - 1].price : true;
                    const color = isUp ? GREEN : RED;

                    if (isHighlight) {
                        ctx.save();
                        const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22);
                        const col = color;
                        grad.addColorStop(0, col + '60');
                        grad.addColorStop(1, col + '00');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.restore();
                    }

                    const radius = isHighlight ? 7 : 4.5;
                    ctx.save();
                    ctx.shadowColor = 'rgba(0,0,0,0.08)';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                    ctx.restore();
                }

                // ── annotation: current price ──
                if (pts.length > 0) {
                    ctx.save();
                    ctx.font = '12px Inter, -apple-system, sans-serif';
                    ctx.fillStyle = '#2a4a6a';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    const last = pts[pts.length - 1];
                    const cLast = toCanvasX(last.t, xMin, xMax);
                    ctx.fillText('$' + last.price.toFixed(2), cLast - 4, PAD.top - 4);
                    ctx.restore();
                }
            }

            // ─── update UI stats ──────────────────────────────────────
            function updateStats(pts) {
                pointCountDisplay.textContent = pts.length;
                if (pts.length === 0) {
                    rangeDisplay.textContent = '—';
                    priceRangeDisplay.textContent = '—';
                    dailyChangeDisplay.textContent = '+0.00';
                    totalChangeDisplay.textContent = '+0.00';
                    tradeChangeDisplay.textContent = '+0.00';
                    return;
                }
                const minT = pts[0].t;
                const maxT = pts[pts.length - 1].t;
                rangeDisplay.textContent = minT + ' … ' + maxT;

                let minP = Infinity,
                    maxP = -Infinity;
                for (const p of pts) {
                    if (p.price < minP) minP = p.price;
                    if (p.price > maxP) maxP = p.price;
                }
                priceRangeDisplay.textContent = minP.toFixed(2) + ' … ' + maxP.toFixed(2);
                updateCountDisplay.textContent = updateCounter;

                const currentPrice = pts[pts.length - 1].price;

                // 1. Trade change (from previous price)
                let tradeChange = 0;
                let tradePct = 0;
                if (pts.length > 1) {
                    const prevPrice = pts[pts.length - 2].price;
                    tradeChange = currentPrice - prevPrice;
                    tradePct = (tradeChange / prevPrice) * 100;
                }
                const tradeSign = tradeChange >= 0 ? '+' : '';
                tradeChangeDisplay.textContent = `${tradeSign}${tradeChange.toFixed(2)} (${tradeSign}${tradePct.toFixed(2)}%)`;
                tradeChangeDisplay.style.color = tradeChange >= 0 ? GREEN : RED;
                tradeDot.style.background = tradeChange >= 0 ? GREEN : RED;

                // 2. Daily change (from start of current day)
                const dailyChange = currentPrice - dayStartPrice;
                const dailyPct = dayStartPrice !== 0 ? (dailyChange / dayStartPrice) * 100 : 0;
                const dailySign = dailyChange >= 0 ? '+' : '';
                dailyChangeDisplay.textContent = `${dailySign}${dailyChange.toFixed(2)} (${dailySign}${dailyPct.toFixed(2)}%)`;
                dailyChangeDisplay.style.color = dailyChange >= 0 ? GREEN : RED;
                dailyDot.style.background = dailyChange >= 0 ? GREEN : RED;

                // 3. Total change (from initial)
                const totalChange = currentPrice - INITIAL_PRICE;
                const totalPct = (totalChange / INITIAL_PRICE) * 100;
                const totalSign = totalChange >= 0 ? '+' : '';
                totalChangeDisplay.textContent = `${totalSign}${totalChange.toFixed(2)} (${totalSign}${totalPct.toFixed(2)}%)`;
                totalChangeDisplay.style.color = totalChange >= 0 ? GREEN : RED;
                totalDot.style.background = totalChange >= 0 ? GREEN : RED;
            }

            // ─── render ──────────────────────────────────────────────
            function render(highlightIndex = -1) {
                draw(data, highlightIndex);
                updateStats(data);
                updateBiasDisplay();
                updateTitle();
            }

            // ─── step forward ──────────────────────────────────────────
            function stepForward() {
                addPointAndTrim();
                render(-1);
            }

            // ─── reset ─────────────────────────────────────────────────
            function resetData() {
                let max = parseInt(pointCountInput.value, 10);
                if (isNaN(max) || max < 2) max = 2;
                if (max > 150) max = 150;
                pointCountInput.value = max;
                maxPoints = max;

                // Read circuit limits
                let upper = parseFloat(upperCircuitInput.value);
                if (isNaN(upper) || upper < 0.5) upper = 0.5;
                upperCircuitPct = Math.min(upper, 20);
                upperCircuitInput.value = upperCircuitPct;

                let lower = parseFloat(lowerCircuitInput.value);
                if (isNaN(lower) || lower < 0.5) lower = 0.5;
                lowerCircuitPct = Math.min(lower, 20);
                lowerCircuitInput.value = lowerCircuitPct;

                data = generateInitialData(maxPoints);
                updateCounter = 0;
                circuitHit = false;
                circuitBadge.style.display = 'none';
                render(-1);
            }

            // ─── apply new equation ──────────────────────────────────
            function applyEquation() {
                const expr = equationInput.value.trim() || 'Math.sin(x)';
                userEquation = expr;
                evalFn = compileEquation(expr);
                // Update dropdown
                const options = equationSelect.options;
                let found = false;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].value === expr) {
                        equationSelect.selectedIndex = i;
                        found = true;
                        break;
                    }
                }
                if (isPlaying) {
                    clearInterval(autoIntervalId);
                    autoIntervalId = null;
                    isPlaying = false;
                    playBtn.innerHTML = '<span class="icon">▶</span> Play';
                    playBtn.className = 'btn success';
                    statusBadge.textContent = '⏸ paused';
                    statusBadge.className = 'status-badge';
                }
                resetData();
            }

            // ─── play / pause ──────────────────────────────────────────
            function togglePlay() {
                if (isPlaying) {
                    clearInterval(autoIntervalId);
                    autoIntervalId = null;
                    isPlaying = false;
                    playBtn.innerHTML = '<span class="icon">▶</span> Play';
                    playBtn.className = 'btn success';
                    statusBadge.textContent = '⏸ paused';
                    statusBadge.className = 'status-badge';
                } else {
                    const delay = parseInt(intervalInput.value, 10);
                    if (isNaN(delay) || delay < 100) {
                        intervalInput.value = 1000;
                        intervalDelay = 1000;
                    } else {
                        intervalDelay = Math.min(5000, Math.max(100, delay));
                        intervalInput.value = intervalDelay;
                    }
                    if (data.length < 2) {
                        resetData();
                    }
                    autoIntervalId = setInterval(stepForward, intervalDelay);
                    isPlaying = true;
                    playBtn.innerHTML = '<span class="icon">⏸</span> Pause';
                    playBtn.className = 'btn danger';
                    statusBadge.textContent = '▶ playing';
                    statusBadge.className = 'status-badge playing';
                }
            }

            // ─── tooltip ──────────────────────────────────────────────
            let hoveredIndex = -1;

            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;
                return { mx, my };
            }

            function findClosestPoint(mx, my) {
                if (data.length === 0) return -1;
                const xMin = data[0].t;
                const xMax = data[data.length - 1].t;
                let yMin = Infinity,
                    yMax = -Infinity;
                for (const p of data) {
                    if (p.price < yMin) yMin = p.price;
                    if (p.price > yMax) yMax = p.price;
                }
                const padding = (yMax - yMin) * 0.08 || 1;
                yMin = Math.max(yMin - padding, 0);
                yMax = yMax + padding;

                let bestIdx = -1;
                let bestDist = Infinity;
                const threshold = 32;
                for (let i = 0; i < data.length; i++) {
                    const cx = toCanvasX(data[i].t, xMin, xMax);
                    const cy = toCanvasY(data[i].price, yMin, yMax);
                    const dx = cx - mx;
                    const dy = cy - my;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestIdx = i;
                    }
                }
                return (bestDist < threshold) ? bestIdx : -1;
            }

            function showTooltip(e, idx) {
                if (idx < 0 || idx >= data.length) {
                    tooltip.classList.remove('visible');
                    return;
                }
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const p = data[idx];
                const xMin = data[0].t;
                const xMax = data[data.length - 1].t;
                let yMin = Infinity,
                    yMax = -Infinity;
                for (const p2 of data) {
                    if (p2.price < yMin) yMin = p2.price;
                    if (p2.price > yMax) yMax = p2.price;
                }
                const padding = (yMax - yMin) * 0.08 || 1;
                yMin = Math.max(yMin - padding, 0);
                yMax = yMax + padding;

                const cx = toCanvasX(p.t, xMin, xMax);
                const cy = toCanvasY(p.price, yMin, yMax);

                const cssX = (cx / scaleX) + rect.left;
                const cssY = (cy / scaleY) + rect.top - 12;

                tooltip.innerHTML =
                    `<span class="label">time</span> = ${p.t} &nbsp;·&nbsp; <span class="label">price</span> = $${p.price.toFixed(2)}`;
                tooltip.style.left = cssX + 'px';
                tooltip.style.top = (cssY - 32) + 'px';
                tooltip.style.transform = 'translateX(-50%)';
                tooltip.classList.add('visible');
            }

            // ─── canvas events ────────────────────────────────────────
            canvas.addEventListener('mousemove', (e) => {
                const { mx, my } = getMousePos(e);
                const idx = findClosestPoint(mx, my);
                if (idx !== hoveredIndex) {
                    hoveredIndex = idx;
                    render(idx);
                }
                showTooltip(e, idx);
            });

            canvas.addEventListener('mouseleave', () => {
                hoveredIndex = -1;
                render(-1);
                tooltip.classList.remove('visible');
            });

            // ─── button events ────────────────────────────────────────
            generateBtn.addEventListener('click', () => {
                if (isPlaying) {
                    clearInterval(autoIntervalId);
                    autoIntervalId = null;
                    isPlaying = false;
                    playBtn.innerHTML = '<span class="icon">▶</span> Play';
                    playBtn.className = 'btn success';
                    statusBadge.textContent = '⏸ paused';
                    statusBadge.className = 'status-badge';
                }
                resetData();
            });

            playBtn.addEventListener('click', togglePlay);

            applyEqBtn.addEventListener('click', applyEquation);
            equationInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    applyEquation();
                }
            });

            equationSelect.addEventListener('change', function() {
                const val = this.value;
                equationInput.value = val;
                applyEquation();
            });

            pointCountInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (isPlaying) togglePlay();
                    resetData();
                }
            });

            intervalInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (isPlaying) {
                        clearInterval(autoIntervalId);
                        const delay = parseInt(intervalInput.value, 10);
                        if (!isNaN(delay) && delay >= 100) {
                            intervalDelay = Math.min(5000, Math.max(100, delay));
                            intervalInput.value = intervalDelay;
                            autoIntervalId = setInterval(stepForward, intervalDelay);
                        } else {
                            intervalInput.value = intervalDelay;
                        }
                    } else {
                        const delay = parseInt(intervalInput.value, 10);
                        if (!isNaN(delay) && delay >= 100) {
                            intervalDelay = Math.min(5000, Math.max(100, delay));
                            intervalInput.value = intervalDelay;
                        } else {
                            intervalInput.value = intervalDelay;
                        }
                    }
                }
            });

            // Circuit limit input listeners
            upperCircuitInput.addEventListener('change', resetData);
            lowerCircuitInput.addEventListener('change', resetData);

            // ─── init ──────────────────────────────────────────────────
            evalFn = compileEquation(userEquation);
            resetData();

            const initVal = equationInput.value;
            const options = equationSelect.options;
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === initVal) {
                    equationSelect.selectedIndex = i;
                    break;
                }
            }

        })();
    </script>
</body>
